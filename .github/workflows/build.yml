name: Build Spigot 1.8.8 plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build LPC-Hover 3.7.2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Install Spigot 1.8.8 API
        run: |
          mkdir -p lib
          curl -L \
            "https://hub.spigotmc.org/nexus/content/repositories/snapshots/org/spigotmc/spigot-api/1.8.8-R0.1-SNAPSHOT/spigot-api-1.8.8-R0.1-SNAPSHOT.jar" \
            -o lib/spigot-api-1.8.8.jar

          test -s lib/spigot-api-1.8.8.jar
          ls -lh lib/spigot-api-1.8.8.jar

      - name: Build LPC-Hover
        run: mvn -f pom.xml clean package -U

      - name: Check JAR
        run: |
          echo "=== TARGET ==="
          ls -lah target/
          test -f target/LPC-Hover-3.7.2.jar

      - name: Upload LPC-Hover JAR
        uses: actions/upload-artifact@v4
        with:
          name: LPC-Hover-3.7.2
          path: target/LPC-Hover-3.7.2.jar
