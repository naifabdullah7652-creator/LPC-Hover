name: Build LPC-Hover 3.7.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Spigot 1.8.8 plugin
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build Spigot 1.8.8 with BuildTools
        run: |
          mkdir -p buildtools
          cd buildtools
          wget -O BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          java -jar BuildTools.jar --rev 1.8.8

      - name: Build LPC-Hover
        run: |
          mvn -f pom.xml clean package -U

      - name: Upload LPC-Hover JAR
        uses: actions/upload-artifact@v4
        with:
          name: LPC-Hover-3.7.2
          path: target/LPC-Hover-3.7.2.jar
