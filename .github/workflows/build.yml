name: Build LPC-Hover 3.7.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build with Maven
        run: mvn -f pom.xml clean package -U

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: LPC-Hover-3.7.2
          path: target/LPC-Hover-3.7.2.jar
