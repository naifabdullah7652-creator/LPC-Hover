name: Build LPC-Hover-Nova-1.8.8

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # تثبيت Java 8
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # إنشاء مجلد lib
      - name: Create lib folder
        run: |
          mkdir -p lib

      # تحميل Spigot 1.8.8
      - name: Download Spigot 1.8.8
        run: |
          curl -L \
            -o lib/Spigot-1.8.8.jar \
            "https://repo.aikar.co/nexus/content/repositories/aikar/org/spigotmc/spigot/1.8.8-R0.1-SNAPSHOT/spigot-1.8.8-R0.1-SNAPSHOT.jar"

          echo "Spigot-1.8.8.jar downloaded successfully."

          test -f lib/Spigot-1.8.8.jar

          ls -lh lib/Spigot-1.8.8.jar

      # التأكد من وجود الملف
      - name: Verify Spigot
        run: |
          echo "Checking Spigot JAR..."
          test -f lib/Spigot-1.8.8.jar
          echo "Spigot-1.8.8.jar found."

      # بناء المشروع
      - name: Build LPC-Hover
        run: |
          mvn clean package

      # التأكد من وجود الـJAR الناتج
      - name: Verify build
        run: |
          echo "Checking generated JAR..."
          ls -lh target/
          test -f target/LPC-Hover-Nova-1.8.8.jar
          echo "LPC-Hover-Nova-1.8.8.jar created successfully."

      # رفع الـJAR كـArtifact
      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: LPC-Hover-Nova-1.8.8
          path: target/LPC-Hover-Nova-1.8.8.jar
